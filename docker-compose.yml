services:
  api:
    build: .
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  worker:
    build: .
    env_file: .env
    command: celery -A activationlab worker -l INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activationlab
      POSTGRES_USER: activationlab
      POSTGRES_PASSWORD: activationlab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activationlab -d activationlab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["15672:15672"]

volumes:
  postgres_data:
